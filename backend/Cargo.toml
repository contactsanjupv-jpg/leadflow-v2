[package]
name = "xflow-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "xflow_backend"
path = "src/lib.rs"

[[bin]]
name = "xflow-backend"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.36.0", features = ["full"] }
axum = { version = "=0.7.4" }
tower = { version = "=0.4.13", features = ["util"] }
tower-http = { version = "=0.5.2", features = ["cors", "trace", "limit"] }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
sqlx = { version = "=0.7.3", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json", "migrate", "macros", "rust_decimal"] }
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
thiserror = "=1.0.57"
anyhow = "=1.0.80"
uuid = { version = "=1.7.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.34", features = ["serde"] }
rust_decimal = { version = "=1.34.3", default-features = false, features = ["std", "serde-with-str"] }
argon2 = "=0.5.3"
rand = "=0.8.5"
sha2 = "=0.10.8"
hmac = "=0.12.1"
dotenvy = "=0.15.7"

[dev-dependencies]
